kind = "web"
previewPath = "/"
title = "JanSahay AI"
description = "A citizen guidance app for discovering government schemes, understanding eligibility, tracking required documents, and finding verified steps to obtain them."
version = "1.0.0"
id = "artifacts/jansahay"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23914

[services.development]
run = "pnpm --filter @workspace/jansahay run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jansahay", "run", "build" ]
serve = "static"
publicDir = "artifacts/jansahay/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23914"
BASE_PATH = "/"
