openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: JanSahay scheme discovery and document preparation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: profile
  - name: schemes
  - name: checklists
  - name: documents
  - name: dashboard
  - name: assistant
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the signed-in citizen's profile
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Citizen profile, or an empty profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenProfile" }
    put:
      operationId: saveProfile
      tags: [profile]
      summary: Save the signed-in citizen's relevant profile details
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitizenProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitizenProfile" }
  /schemes:
    get:
      operationId: listSchemes
      tags: [schemes]
      summary: List published and clearly labelled demonstration schemes
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
      responses:
        "200":
          description: Scheme records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scheme" }
  /schemes/{schemeId}:
    get:
      operationId: getScheme
      tags: [schemes]
      summary: Get scheme details
      parameters:
        - $ref: "#/components/parameters/SchemeId"
      responses:
        "200":
          description: Scheme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scheme" }
        "404": { description: Scheme not found }
  /recommendations:
    post:
      operationId: getRecommendations
      tags: [schemes]
      summary: Evaluate a profile against published scheme rules
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitizenProfileInput" }
      responses:
        "200":
          description: Explanation for each matching scheme
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recommendation" }
  /schemes/{schemeId}/documents:
    get:
      operationId: getSchemeDocuments
      tags: [schemes, documents]
      summary: List required documents for a scheme
      parameters:
        - $ref: "#/components/parameters/SchemeId"
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchemeDocument" }
  /schemes/{schemeId}/document-readiness:
    get:
      operationId: getSchemeReadiness
      tags: [schemes, checklists]
      summary: Compare a scheme's documents with the citizen's private checklist
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/SchemeId"
      responses:
        "200":
          description: Document preparation summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentReadiness" }
  /checklists/{schemeId}:
    get:
      operationId: getChecklist
      tags: [checklists]
      summary: Get the signed-in citizen's document statuses for a scheme
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/SchemeId"
      responses:
        "200":
          description: Checklist items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
    put:
      operationId: updateChecklist
      tags: [checklists]
      summary: Update document statuses for the signed-in citizen
      description: Status is stored once per citizen and canonical document type, then reused across schemes.
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/SchemeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistInput" }
      responses:
        "200":
          description: Updated checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
  /documents/guides:
    get:
      operationId: listDocumentGuides
      tags: [documents]
      summary: Find published document guides
      parameters:
        - in: query
          name: documentType
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: verificationStatus
          schema: { $ref: "#/components/schemas/VerificationStatus" }
      responses:
        "200":
          description: Matching guides
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentGuide" }
  /documents/guides/by-type/{documentType}:
    get:
      operationId: getDocumentGuidesForType
      tags: [documents]
      summary: Find the best published guide for a document and state
      parameters:
        - in: path
          name: documentType
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matching guides
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentGuide" }
  /documents/guides/{guideId}:
    get:
      operationId: getDocumentGuide
      tags: [documents]
      summary: Get a document guidance record
      parameters:
        - in: path
          name: guideId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentGuide" }
        "404": { description: Guide not found }
  /dashboard/document-preparation:
    get:
      operationId: getPreparationDashboard
      tags: [dashboard]
      summary: Summarize document preparation across recommended schemes
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Citizen-specific preparation summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparationDashboard" }
  /assistant/explain:
    post:
      operationId: explainGuidance
      tags: [assistant]
      summary: Explain stored scheme and document information without inventing details
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantQuestion" }
      responses:
        "200":
          description: Grounded explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantAnswer" }
  /admin/document-guides:
    get:
      operationId: listAdminDocumentGuides
      tags: [admin]
      summary: List all document guides for administrators
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: All guide records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentGuide" }
    post:
      operationId: createDocumentGuide
      tags: [admin]
      summary: Create an unpublished document guide
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentGuideInput" }
      responses:
        "201":
          description: Created guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentGuide" }
  /admin/document-guides/{guideId}:
    patch:
      operationId: updateDocumentGuide
      tags: [admin]
      summary: Update a document guide
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/GuideId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentGuideUpdate" }
      responses:
        "200":
          description: Updated guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentGuide" }
  /admin/document-guides/{guideId}/references:
    get:
      operationId: getGuideReferences
      tags: [admin]
      summary: Review schemes that reference a guide's document type
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/GuideId"
      responses:
        "200":
          description: Referencing schemes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scheme" }
  /admin/document-guides/{guideId}/verify:
    post:
      operationId: verifyDocumentGuide
      tags: [admin]
      summary: Mark a guide verified only after an official-source review
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/GuideId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideVerificationInput" }
      responses:
        "200":
          description: Verified guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentGuide" }
  /admin/document-guides/{guideId}/publish:
    post:
      operationId: publishDocumentGuide
      tags: [admin]
      summary: Publish an eligible guide
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/GuideId"
      responses:
        "200":
          description: Published guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentGuide" }
  /admin/document-guides/{guideId}/archive:
    post:
      operationId: archiveDocumentGuide
      tags: [admin]
      summary: Archive a guide
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/GuideId"
      responses:
        "200":
          description: Archived guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentGuide" }
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    SchemeId:
      in: path
      name: schemeId
      required: true
      schema: { type: string }
    GuideId:
      in: path
      name: guideId
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    MatchStatus:
      type: string
      enum: [strong_match, potential_match, more_information_required, not_a_match]
    DocumentStatus:
      type: string
      enum: [unknown, available, missing, needs_verification]
    VerificationStatus:
      type: string
      enum: [verified, unverified, outdated]
    PublicationStatus:
      type: string
      enum: [draft, published, archived, demonstration]
    CitizenProfileInput:
      type: object
      properties:
        age: { type: ["integer", "null"], minimum: 0, maximum: 120 }
        state: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        occupation: { type: ["string", "null"] }
        educationLevel: { type: ["string", "null"] }
        course: { type: ["string", "null"] }
        currentYear: { type: ["integer", "null"], minimum: 1, maximum: 20 }
        annualFamilyIncome: { type: ["integer", "null"], minimum: 0 }
        student: { type: ["boolean", "null"] }
        farmer: { type: ["boolean", "null"] }
        businessOwner: { type: ["boolean", "null"] }
        employmentStatus: { type: ["string", "null"] }
        socialCategory: { type: ["string", "null"] }
    CitizenProfile:
      allOf:
        - $ref: "#/components/schemas/CitizenProfileInput"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: ["string", "null"], format: date-time }
    SchemeDocument:
      type: object
      required: [documentType, title, reason]
      properties:
        documentType: { type: string }
        title: { type: string }
        reason: { type: string }
        issuingAuthority: { type: ["string", "null"] }
    Scheme:
      type: object
      required: [id, name, description, category, targetBeneficiaries, occupations, educationConditions, benefits, requiredDocuments, eligibilityRules, officialSourceUrl, verificationStatus, publicationStatus, sourceKind]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        targetBeneficiaries: { type: string }
        occupations: { type: array, items: { type: string } }
        state: { type: ["string", "null"] }
        minimumAge: { type: ["integer", "null"] }
        maximumAge: { type: ["integer", "null"] }
        maximumAnnualIncome: { type: ["integer", "null"] }
        educationConditions: { type: array, items: { type: string } }
        eligibilityRules: { type: array, items: { type: string } }
        benefits: { type: array, items: { type: string } }
        requiredDocuments:
          type: array
          items: { $ref: "#/components/schemas/SchemeDocument" }
        applicationInstructions: { type: ["string", "null"] }
        officialSourceUrl: { type: ["string", "null"], format: uri }
        lastVerifiedAt: { type: ["string", "null"], format: date-time }
        verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
        publicationStatus: { $ref: "#/components/schemas/PublicationStatus" }
        sourceKind:
          type: string
          enum: [curated, demonstration]
    Recommendation:
      type: object
      required: [scheme, status, matchedConditions, failedConditions, unknownConditions]
      properties:
        scheme: { $ref: "#/components/schemas/Scheme" }
        status: { $ref: "#/components/schemas/MatchStatus" }
        matchedConditions: { type: array, items: { type: string } }
        failedConditions: { type: array, items: { type: string } }
        unknownConditions: { type: array, items: { type: string } }
    ChecklistItem:
      type: object
      required: [documentType, title, status, relatedSchemes]
      properties:
        documentType: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        relatedSchemes:
          type: array
          items: { type: string }
        updatedAt: { type: ["string", "null"], format: date-time }
    ChecklistInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [documentType, status]
            properties:
              documentType: { type: string, minLength: 1 }
              status: { $ref: "#/components/schemas/DocumentStatus" }
    Checklist:
      type: object
      required: [schemeId, items]
      properties:
        schemeId: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
    DocumentReadiness:
      type: object
      required: [schemeId, items, readyCount, totalCount, progressPercent]
      properties:
        schemeId: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
        readyCount: { type: integer }
        totalCount: { type: integer }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
    DocumentGuide:
      type: object
      required: [id, documentType, title, simpleDescription, applicableState, eligibilityOrPrerequisites, requiredSupportingDocuments, applicationSteps, applicationMethod, officialApplicationUrl, officialInformationUrl, verificationStatus, publicationStatus, additionalNotes]
      properties:
        id: { type: string }
        documentType: { type: string }
        title: { type: string }
        simpleDescription: { type: string }
        applicableState: { type: string }
        issuingAuthority: { type: ["string", "null"] }
        eligibilityOrPrerequisites: { type: array, items: { type: string } }
        requiredSupportingDocuments: { type: array, items: { type: string } }
        applicationSteps: { type: array, items: { type: string } }
        applicationMethod: { type: string }
        officialApplicationUrl: { type: ["string", "null"], format: uri }
        officialInformationUrl: { type: ["string", "null"], format: uri }
        possibleFees: { type: ["string", "null"] }
        expectedProcessingTime: { type: ["string", "null"] }
        lastVerifiedAt: { type: ["string", "null"], format: date-time }
        verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
        publicationStatus: { $ref: "#/components/schemas/PublicationStatus" }
        additionalNotes: { type: string }
    DocumentGuideInput:
      type: object
      required: [documentType, title, simpleDescription, applicableState, eligibilityOrPrerequisites, requiredSupportingDocuments, applicationSteps, applicationMethod, officialApplicationUrl, officialInformationUrl, additionalNotes]
      properties:
        documentType: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        simpleDescription: { type: string }
        applicableState: { type: string, minLength: 1 }
        issuingAuthority: { type: ["string", "null"] }
        eligibilityOrPrerequisites: { type: array, items: { type: string } }
        requiredSupportingDocuments: { type: array, items: { type: string } }
        applicationSteps: { type: array, items: { type: string } }
        applicationMethod: { type: string }
        officialApplicationUrl: { type: ["string", "null"], format: uri }
        officialInformationUrl: { type: ["string", "null"], format: uri }
        possibleFees: { type: ["string", "null"] }
        expectedProcessingTime: { type: ["string", "null"] }
        additionalNotes: { type: string }
    DocumentGuideUpdate:
      allOf:
        - $ref: "#/components/schemas/DocumentGuideInput"
        - type: object
          properties:
            verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
    GuideVerificationInput:
      type: object
      required: [officialSourceUrl, lastVerifiedAt]
      properties:
        officialSourceUrl: { type: string, format: uri }
        lastVerifiedAt: { type: string, format: date-time }
        additionalNotes: { type: string }
    PreparationDashboard:
      type: object
      required: [items, readyCount, missingCount, unknownCount, totalCount, progressPercent]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
        readyCount: { type: integer }
        missingCount: { type: integer }
        unknownCount: { type: integer }
        totalCount: { type: integer }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
    AssistantQuestion:
      type: object
      required: [question, language]
      properties:
        question: { type: string, minLength: 1, maxLength: 1000 }
        schemeId: { type: ["string", "null"] }
        documentType: { type: ["string", "null"] }
        language:
          type: string
          enum: [en, hi, mr]
    AssistantAnswer:
      type: object
      required: [answer, mode, needsVerification, sources]
      properties:
        answer: { type: string }
        mode:
          type: string
          enum: [stored_guidance_demo]
        needsVerification: { type: boolean }
        sources:
          type: array
          items:
            type: object
            required: [title, url]
            properties:
              title: { type: string }
              url: { type: string, format: uri }

