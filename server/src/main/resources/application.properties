spring.application.name=jansahay-backend

# Server port configuration (Render assigns a dynamic PORT environment variable)
server.port=${PORT:8080}

# MySQL Database configuration (Aiven MySQL / Local MySQL)
# Allows individual DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, DB_SSL parameters,
# or a full SPRING_DATASOURCE_URL / DB_URL connection string provided by cloud databases.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jansahay_db}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Database Seeding: Execute data.sql on startup to seed schemes, users, and guides (idempotent with ON DUPLICATE KEY UPDATE)
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Security & JWT Configuration (configured via JWT_SECRET environment variable)
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# CORS Configuration (comma-separated origins or auto-allows *.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# AI Assistant Configuration
ai.provider=${AI_PROVIDER:mock}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-1.5-flash

# Logging
logging.level.com.jansahay=INFO
